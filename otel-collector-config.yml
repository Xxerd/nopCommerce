# OpenTelemetry Collector configuration
# Receives OTLP from nopCommerce → exports traces to Jaeger, metrics to Prometheus

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Drop any span/metric attribute that could carry PII.
  # nopCommerce services must already avoid recording PII, but this acts as
  # a defence-in-depth layer consistent with the assignment's sensitive-data
  # exclusion requirement.
  attributes/redact_pii:
    actions:
      - key: customer.email
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: db.statement
        action: hash   # keep query shape for debugging, redact values

exporters:
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: nopcommerce

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [batch, attributes/redact_pii]
      exporters:  [otlp/jaeger, debug]

    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [prometheus, debug]
