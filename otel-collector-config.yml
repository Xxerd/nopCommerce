# OpenTelemetry Collector configuration
# Receives OTLP from nopCommerce → exports traces to Jaeger, metrics to Prometheus

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024


  attributes/redact_pii:
    actions:
      - key: admin.email
        action: delete
      - key: admin.username
        action: delete
      - key: admin.first_name
        action: delete
      - key: admin.last_name
        action: delete
      - key: admin.phone
        action: delete
      - key: admin.ip_address
        action: delete

      
      - key: db.connection_string
        action: hash   
      - key: db.user
        action: hash   
      - key: net.peer.ip
        action: hash  

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [batch, attributes/redact_pii]
      exporters:  [otlp/jaeger, debug]

    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [prometheus, debug]
